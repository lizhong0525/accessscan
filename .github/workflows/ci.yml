name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the test job only needs to read the checked-out code.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Core logic is stdlib-only; pytest is the single test dependency.
      # No browsers, no network services, no credentials.
      - run: pip install pytest
      - run: python -m pytest -q
